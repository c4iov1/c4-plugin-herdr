id = "c4.session-tab-rename"
name = "Session Tab Rename"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Names Herdr tabs from native agent session names, first prompts, and terminal context."
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["node", "index.js", "startup"]

[[events]]
on = "tab.created"
command = ["node", "index.js", "event"]

[[events]]
on = "tab.focused"
command = ["node", "index.js", "event"]

[[events]]
on = "tab.renamed"
command = ["node", "index.js", "event"]

[[events]]
on = "pane.created"
command = ["node", "index.js", "event"]

[[events]]
on = "pane.focused"
command = ["node", "index.js", "event"]

[[events]]
on = "pane.output_changed"
command = ["node", "index.js", "event"]

[[events]]
on = "pane.agent_detected"
command = ["node", "index.js", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.js", "event"]

[[events]]
on = "pane.closed"
command = ["node", "index.js", "event"]

[[events]]
on = "pane.exited"
command = ["node", "index.js", "event"]

[[actions]]
id = "rename-now"
title = "Rename current tab from session context"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "index.js", "rename-now"]

[[actions]]
id = "reset"
title = "Reset current tab automatic naming"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "index.js", "reset"]
